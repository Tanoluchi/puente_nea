<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#FCF8EF">
<script>document.documentElement.classList.add('js');setTimeout(()=>{if(!document.documentElement.classList.contains('reveal-ready'))document.documentElement.classList.remove('js')},3000);try{if(localStorage.getItem('theme') === 'dark')document.documentElement.dataset.theme='dark'}catch(e){}</script>
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<meta property="og:title" content="{{OG_TITLE}}">
<meta property="og:description" content="{{OG_DESCRIPTION}}">
<meta property="og:type" content="website">
<meta property="og:locale" content="es_AR">
<meta property="og:site_name" content="Puente NEA">
<meta property="og:url" content="{{PAGE_URL}}">
<meta property="og:image" content="{{SITE}}assets/og-puente.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="El puente General Belgrano dibujado con puntos sobre el río y el sol">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="{{PAGE_URL}}">
<link rel="icon" href="{{BASE}}assets/favicon.svg">
<link rel="stylesheet" href="{{BASE}}styles/landing.css">
{{EXTRA_HEAD}}
</head>
